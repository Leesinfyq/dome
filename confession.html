<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>有件事想告诉你...</title>
    <style>
        body {
            background: #ffe6f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: '微软雅黑', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #ff69b4;
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        p {
            color: #333;
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            /* 关键修改：垂直排列按钮 */
            gap: 20px;
            /* 调整按钮间距 */
            align-items: center;
            /* 水平居中 */
            margin-top: 30px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 150px;
            /* 固定按钮宽度避免文字过长变形 */
        }

        #acceptBtn {
            background: #ff69b4;
            color: white;
        }

        #rejectBtn {
            background: white;
            color: #ff69b4;
            border: 2px solid #ff69b4;
            position: relative;
            /* 关键修改：改为相对定位（避免绝对定位导致重叠） */
        }

        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .modal h2 {
            color: #ff69b4;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>有件事，想认真告诉你</h1>
        <p>从第一次见到你，<br>
            心跳就像失控的小鹿，<br>
            眼睛总是忍不住跟着你转。<br><br>
            我知道这有点突然，<br>
            但我不想再藏着了——<br>
            我喜欢你，做我女朋友好不好！</p>
        <div class="buttons">
            <button class="btn" id="acceptBtn">我愿意！</button>
            <button class="btn" id="rejectBtn">拒绝</button> <!-- 移除多余的<br>标签 -->
        </div>
    </div>

    <!-- 成功提示模态框（未修改） -->
    <div class="modal" id="successModal">
        <h2>太好啦！❤️</h2>
        <p>从今天起，<br>
            我就是你的专属笨蛋，<br>
            要陪你看日出日落，<br>
            吃遍所有好吃的，<br>
            直到头发都白～</p>
    </div>

    <script>
        // 拒绝按钮移动逻辑（优化范围避免覆盖接受按钮）
        const rejectBtn = document.getElementById('rejectBtn');
        rejectBtn.addEventListener('mouseover', () => {
            // 限制Y轴移动范围在接受按钮下方（避免覆盖）
            const minY = document.getElementById('acceptBtn').offsetTop + document.getElementById('acceptBtn').offsetHeight + 30;
            const maxX = window.innerWidth - rejectBtn.offsetWidth - 20;
            const maxY = window.innerHeight - rejectBtn.offsetHeight - 20;
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.max(minY, Math.floor(Math.random() * maxY)); // 确保Y坐标大于接受按钮底部
            rejectBtn.style.left = randomX + 'px';
            rejectBtn.style.top = randomY + 'px';
        });

        // 接受按钮点击事件（未修改）
        document.getElementById('acceptBtn').addEventListener('click', () => {
            document.getElementById('successModal').style.display = 'block';
        });
    </script>
</body>
</html>
